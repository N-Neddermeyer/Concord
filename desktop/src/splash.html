<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Clone Local</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: #1e1f22; color: #dbdee1; font: 14px/1.4 "gg sans", "Noto Sans", "Segoe UI", sans-serif;
      -webkit-app-region: drag; user-select: none;
    }
    .loader { display: flex; gap: 6px; }
    .loader span {
      width: 10px; height: 10px; border-radius: 3px; background: #5865f2;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .loader span:nth-child(2) { animation-delay: 0.15s; }
    .loader span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    #status { text-transform: uppercase; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #b5bac1; text-align: center; padding: 0 16px; }
  </style>
</head>
<body>
  <div class="loader"><span></span><span></span><span></span></div>
  <div id="status">Verificando o servidor…</div>
  <script>
    window.setStatus = (text) => { document.getElementById('status').textContent = text; };
  </script>
</body>
</html>
