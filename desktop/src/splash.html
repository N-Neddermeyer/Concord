<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Clone Local</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: #1e1f22; color: #dbdee1; font: 14px/1.4 "gg sans", "Noto Sans", "Segoe UI", sans-serif;
      -webkit-app-region: drag; user-select: none;
    }
    .loader { display: flex; gap: 6px; }
    .loader span {
      width: 10px; height: 10px; border-radius: 3px; background: #5865f2;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .loader span:nth-child(2) { animation-delay: 0.15s; }
    .loader span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    #status { text-transform: uppercase; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #b5bac1; text-align: center; padding: 0 16px; }

    /* Servidor inacessível: formulário para corrigir o endereço. */
    form { display: none; width: 100%; box-sizing: border-box; padding: 0 24px; flex-direction: column; gap: 10px; -webkit-app-region: no-drag; }
    body.failed .loader { display: none; }
    body.failed #status { text-transform: none; font-weight: 500; letter-spacing: 0; color: #f23f43; font-size: 13px; }
    body.failed form { display: flex; }
    h1 { margin: 0; font-size: 18px; color: #f2f3f5; text-align: center; }
    label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #b5bac1; }
    input {
      height: 38px; padding: 0 10px; border: 0; border-radius: 4px; outline: 0;
      background: #111214; color: #dbdee1; font: inherit; font-size: 15px; user-select: text;
    }
    .hint { font-size: 12px; color: #949ba4; }
    button { height: 38px; border: 0; border-radius: 4px; font: inherit; font-weight: 600; cursor: pointer; }
    .primary { background: #5865f2; color: #fff; }
    .primary:hover { background: #4752c4; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; background: #4e5058; color: #fff; }
    .row button:hover { background: #6d6f78; }
  </style>
</head>
<body>
  <div class="loader"><span></span><span></span><span></span></div>
  <form id="form">
    <h1>Não foi possível conectar</h1>
    <label for="url">Endereço do servidor</label>
    <input id="url" spellcheck="false" placeholder="192.168.0.10:3001">
    <div class="hint">O endereço aparece no terminal do servidor ("na rede: …").</div>
    <button class="primary" type="submit">Conectar</button>
    <div class="row">
      <button type="button" id="reset">Usar o padrão</button>
      <button type="button" id="quit">Sair</button>
    </div>
  </form>
  <div id="status">Verificando o servidor…</div>
  <script>
    const status = document.getElementById('status');
    const input = document.getElementById('url');
    window.setStatus = (text) => { status.textContent = text; };
    window.showServerForm = ({ message, url, fallback }) => {
      document.body.classList.add('failed');
      status.textContent = message;
      if (!input.value) input.value = url.replace(/^http:\/\//, '');
      document.getElementById('reset').title = fallback;
      input.focus();
      input.select();
    };
    const submit = (value) => {
      document.body.classList.remove('failed');
      status.textContent = 'Reiniciando…';
      window.CloneSplash.setServer(value);
    };
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) submit(input.value.trim());
    });
    document.getElementById('reset').addEventListener('click', () => submit(''));
    document.getElementById('quit').addEventListener('click', () => window.CloneSplash.quit());
  </script>
</body>
</html>
